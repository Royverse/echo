# Netlify deploy config for ECHO
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Local `netlify dev` serves Vite + Functions together on one origin.
[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# Long-cache the hashed build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
